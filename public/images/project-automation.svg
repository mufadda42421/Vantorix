<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Concept: automated workflow pipeline, light minimal illustration">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#e0e0e4"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <rect width="1200" height="720" fill="url(#dots)"/>

  <!-- flow path -->
  <path d="M185 335 C 320 335, 340 215, 470 215 C 600 215, 625 435, 752 435 C 878 435, 905 305, 1015 305" stroke="#1d1d1f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="4 7"/>

  <!-- trigger -->
  <g transform="translate(185,335)">
    <circle r="52" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
    <path d="M -11 -13 L 12 -2 L -11 12 Z" fill="#1d1d1f" transform="translate(1.5,0)"/>
    <text y="80" text-anchor="middle" fill="#6e6e73" font-size="10" font-family="ui-monospace,monospace" letter-spacing="1.5">TRIGGER</text>
  </g>

  <!-- AI enrich -->
  <g transform="translate(470,215)">
    <rect x="-92" y="-52" width="184" height="104" rx="16" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
    <circle cx="-56" cy="-14" r="9" fill="#0071e3"/>
    <rect x="-38" y="-19" width="84" height="7" rx="3.5" fill="#1d1d1f"/>
    <rect x="-38" y="-7" width="54" height="5" rx="2.5" fill="#d2d2d7"/>
    <rect x="-76" y="12" width="152" height="1.2" fill="#e3e3e7"/>
    <rect x="-76" y="22" width="66" height="13" rx="6.5" fill="#f5f5f7" stroke="#d2d2d7"/>
    <rect x="2" y="22" width="70" height="13" rx="6.5" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text y="72" text-anchor="middle" fill="#6e6e73" font-size="10" font-family="ui-monospace,monospace" letter-spacing="1.5">AI ENRICH</text>
  </g>

  <!-- route & act -->
  <g transform="translate(752,435)">
    <rect x="-92" y="-48" width="184" height="96" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.4"/>
    <rect x="-72" y="-26" width="144" height="8" rx="4" fill="#1d1d1f" opacity="0.85"/>
    <rect x="-72" y="-8" width="110" height="7" rx="3.5" fill="#d2d2d7"/>
    <rect x="-72" y="8" width="84" height="7" rx="3.5" fill="#e3e3e7"/>
    <text y="74" text-anchor="middle" fill="#6e6e73" font-size="10" font-family="ui-monospace,monospace" letter-spacing="1.5">ROUTE &amp; ACT</text>
  </g>

  <!-- done -->
  <g transform="translate(1015,305)">
    <circle r="48" fill="#1d1d1f"/>
    <path d="M -14 0 L -3.5 11 L 16 -12" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="72" text-anchor="middle" fill="#6e6e73" font-size="10" font-family="ui-monospace,monospace" letter-spacing="1.5">DONE</text>
  </g>

  <!-- toast -->
  <g transform="translate(600,632)">
    <rect x="-150" y="-17" width="300" height="30" rx="15" fill="#ffffff" stroke="#d2d2d7"/>
    <circle cx="-124" cy="-2" r="4" fill="#0071e3"/>
    <rect x="-110" y="-5.5" width="170" height="6" rx="3" fill="#e3e3e7"/>
  </g>
</svg>
