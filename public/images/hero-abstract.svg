<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Abstract futuristic render of glowing technology core">
  <defs>
    <radialGradient id="bg" cx="62%" cy="42%" r="75%">
      <stop offset="0" stop-color="#141d2e"/>
      <stop offset="0.55" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#080b14"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="0.28" stop-color="#8f6bff"/>
      <stop offset="0.62" stop-color="#5a3ee0"/>
      <stop offset="0.92" stop-color="#1c1440"/>
      <stop offset="1" stop-color="#120c2c"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="42%" cy="38%" r="38%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#b8a5ff" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#7657ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7657ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7657ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7657ff" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#00d4ff" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#a03cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a03cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7657ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7657ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="660" cy="380" r="330" fill="url(#glowPurple)" filter="url(#blur40)"/>
  <circle cx="930" cy="600" r="220" fill="url(#glowCyan)" filter="url(#blur40)"/>
  <circle cx="360" cy="660" r="180" fill="url(#glowPurple)" opacity="0.6" filter="url(#blur40)"/>

  <!-- horizon floor grid -->
  <g opacity="0.5" stroke="#2b3b5e" stroke-width="1">
    <path d="M0 700 H1200" stroke-opacity="0.8"/>
    <path d="M-100 760 L1300 760" stroke-opacity="0.6"/>
    <path d="M-200 830 L1400 830" stroke-opacity="0.4"/>
    <path d="M260 700 L120 900" stroke-opacity="0.55"/>
    <path d="M430 700 L360 900" stroke-opacity="0.55"/>
    <path d="M600 700 L600 900" stroke-opacity="0.55"/>
    <path d="M770 700 L840 900" stroke-opacity="0.55"/>
    <path d="M940 700 L1080 900" stroke-opacity="0.55"/>
  </g>

  <!-- light ribbons -->
  <ellipse cx="640" cy="430" rx="430" ry="120" fill="none" stroke="url(#ribbon1)" stroke-width="3.2" opacity="0.9" transform="rotate(-14 640 430)" filter="url(#soft)"/>
  <ellipse cx="640" cy="430" rx="430" ry="120" fill="none" stroke="url(#ribbon1)" stroke-width="1.1" opacity="1" transform="rotate(-14 640 430)"/>
  <ellipse cx="640" cy="430" rx="330" ry="200" fill="none" stroke="url(#ribbon2)" stroke-width="2.6" opacity="0.85" transform="rotate(18 640 430)" filter="url(#soft)"/>
  <ellipse cx="640" cy="430" rx="330" ry="200" fill="none" stroke="url(#ribbon2)" stroke-width="0.9" opacity="1" transform="rotate(18 640 430)"/>

  <!-- orbit ring system -->
  <g transform="translate(640,420)" fill="none">
    <circle r="205" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.2"/>
    <ellipse rx="205" ry="66" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 9"/>
    <ellipse rx="150" ry="150" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="1 6"/>
  </g>

  <!-- central orb -->
  <circle cx="640" cy="420" r="128" fill="url(#orb)"/>
  <circle cx="640" cy="420" r="128" fill="url(#orbCore)"/>
  <ellipse cx="592" cy="368" rx="44" ry="26" fill="#ffffff" opacity="0.5" filter="url(#blur18)" transform="rotate(-18 592 368)"/>

  <!-- satellite glass spheres -->
  <circle cx="352" cy="300" r="34" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
  <circle cx="352" cy="300" r="34" fill="#7657ff" opacity="0.12"/>
  <circle cx="905" cy="255" r="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.3"/>
  <circle cx="905" cy="255" r="18" fill="#00d4ff" opacity="0.15"/>
  <circle cx="975" cy="480" r="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25"/>
  <circle cx="975" cy="480" r="26" fill="#7657ff" opacity="0.12"/>

  <!-- particle field -->
  <g fill="#cfe6ff">
    <circle cx="240" cy="420" r="1.8" opacity="0.9"/><circle cx="300" cy="185" r="1.3" opacity="0.7"/>
    <circle cx="420" cy="130" r="2" opacity="0.8"/><circle cx="540" cy="95" r="1.2" opacity="0.6"/>
    <circle cx="730" cy="120" r="1.6" opacity="0.8"/><circle cx="845" cy="165" r="2.2" opacity="0.85"/>
    <circle cx="1010" cy="330" r="1.5" opacity="0.7"/><circle cx="1065" cy="560" r="1.9" opacity="0.8"/>
    <circle cx="845" cy="690" r="1.4" opacity="0.6"/><circle cx="455" cy="655" r="1.7" opacity="0.75"/>
    <circle cx="300" cy="540" r="1.2" opacity="0.55"/><circle cx="700" cy="180" r="1.1" opacity="0.6"/>
    <circle cx="520" cy="235" r="1.4" fill="#00d4ff" opacity="0.9"/><circle cx="790" cy="330" r="1.6" fill="#00d4ff" opacity="0.85"/>
    <circle cx="610" cy="575" r="1.5" fill="#a78bff" opacity="0.9"/><circle cx="400" cy="380" r="1.3" fill="#a78bff" opacity="0.8"/>
  </g>
</svg>
