<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Concept: Windows desktop business manager, light minimal illustration">
  <rect width="1200" height="720" fill="#f5f5f7"/>

  <!-- desktop window -->
  <rect x="70" y="70" width="1060" height="580" rx="16" fill="#ffffff" stroke="#d2d2d7"/>
  <rect x="70" y="70" width="1060" height="40" rx="16" fill="#f5f5f7"/>
  <rect x="70" y="96" width="1060" height="14" fill="#f5f5f7"/>
  <rect x="92" y="85" width="120" height="8" rx="4" fill="#d2d2d7"/>
  <circle cx="1100" cy="90" r="5" fill="#d2d2d7"/><circle cx="1080" cy="90" r="5" fill="#d2d2d7"/>

  <!-- sidebar -->
  <rect x="92" y="140" width="216" height="486" rx="12" fill="#f5f5f7"/>
  <rect x="110" y="170" width="110" height="9" rx="4.5" fill="#d2d2d7"/>
  <rect x="110" y="204" width="180" height="28" rx="8" fill="#1d1d1f"/>
  <rect x="124" y="214" width="88" height="8" rx="4" fill="#ffffff"/>
  <rect x="110" y="250" width="148" height="8" rx="4" fill="#e3e3e7"/>
  <rect x="110" y="280" width="148" height="8" rx="4" fill="#e3e3e7"/>
  <rect x="110" y="310" width="148" height="8" rx="4" fill="#e3e3e7"/>
  <rect x="110" y="340" width="148" height="8" rx="4" fill="#e3e3e7"/>
  <rect x="110" y="560" width="180" height="38" rx="8" fill="#ffffff" stroke="#e3e3e7"/>
  <rect x="124" y="573" width="110" height="7" rx="3.5" fill="#d2d2d7"/>

  <!-- stat cards -->
  <g font-family="ui-sans-serif,system-ui">
    <rect x="336" y="140" width="234" height="102" rx="12" fill="#f5f5f7"/>
    <text x="356" y="172" fill="#6e6e73" font-size="9.5" font-family="ui-monospace,monospace">TODAY'S SALES</text>
    <text x="356" y="208" fill="#1d1d1f" font-size="22" font-weight="700">₹48,250</text>

    <rect x="586" y="140" width="226" height="102" rx="12" fill="#f5f5f7"/>
    <text x="604" y="172" fill="#6e6e73" font-size="9.5" font-family="ui-monospace,monospace">INVOICES</text>
    <text x="604" y="208" fill="#1d1d1f" font-size="22" font-weight="700">126</text>

    <rect x="828" y="140" width="268" height="102" rx="12" fill="#f5f5f7"/>
    <text x="846" y="172" fill="#6e6e73" font-size="9.5" font-family="ui-monospace,monospace">LOW STOCK</text>
    <text x="846" y="208" fill="#1d1d1f" font-size="22" font-weight="700">9 items</text>

    <!-- chart -->
    <rect x="336" y="260" width="468" height="356" rx="12" fill="#f5f5f7"/>
    <text x="356" y="292" fill="#1d1d1f" font-size="12" font-weight="600">Weekly revenue</text>
    <rect x="364" y="478" width="30" height="108" rx="3" fill="#1d1d1f"/>
    <rect x="416" y="420" width="30" height="166" rx="3" fill="#d2d2d7"/>
    <rect x="468" y="508" width="30" height="78" rx="3" fill="#1d1d1f"/>
    <rect x="520" y="392" width="30" height="194" rx="3" fill="#d2d2d7"/>
    <rect x="572" y="446" width="30" height="140" rx="3" fill="#1d1d1f"/>
    <rect x="624" y="352" width="30" height="234" rx="3" fill="#0071e3"/>
    <rect x="364" y="586" width="414" height="1.5" fill="#d2d2d7"/>

    <!-- table -->
    <rect x="820" y="260" width="276" height="356" rx="12" fill="#ffffff" stroke="#e3e3e7"/>
    <text x="838" y="292" fill="#1d1d1f" font-size="12" font-weight="600">Recent billing</text>
    <rect x="838" y="310" width="240" height="22" rx="4" fill="#f5f5f7"/>
    <rect x="838" y="348" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="348" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="372" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="372" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="396" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="396" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="420" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="420" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="444" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="444" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="468" width="84" height="7" rx="3.5" fill="#d2d2d7"/><rect x="950" y="468" width="70" height="7" rx="3.5" fill="#e3e3e7"/>
    <rect x="838" y="516" width="240" height="30" rx="8" fill="#1d1d1f"/>
    <rect x="894" y="527" width="110" height="8" rx="4" fill="#ffffff"/>
  </g>
</svg>
