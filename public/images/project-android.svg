<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Concept: Android productivity app, light minimal illustration">
  <rect width="1200" height="720" fill="#f5f5f7"/>

  <!-- left annotation panels -->
  <g>
    <rect x="110" y="96" width="350" height="122" rx="16" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="134" y="126" width="96" height="7" rx="3.5" fill="#d2d2d7"/>
    <rect x="134" y="144" width="230" height="14" rx="7" fill="#f5f5f7" stroke="#e3e3e7"/>
    <rect x="134" y="172" width="150" height="6" rx="3" fill="#e3e3e7"/>

    <rect x="110" y="246" width="350" height="122" rx="16" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="134" y="276" width="96" height="7" rx="3.5" fill="#d2d2d7"/>
    <rect x="134" y="294" width="210" height="14" rx="7" fill="#f5f5f7" stroke="#e3e3e7"/>
    <rect x="134" y="322" width="130" height="6" rx="3" fill="#e3e3e7"/>

    <rect x="110" y="396" width="350" height="122" rx="16" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="134" y="426" width="96" height="7" rx="3.5" fill="#d2d2d7"/>
    <rect x="134" y="444" width="240" height="14" rx="7" fill="#f5f5f7" stroke="#e3e3e7"/>
    <rect x="134" y="472" width="160" height="6" rx="3" fill="#e3e3e7"/>
  </g>

  <!-- phone -->
  <g transform="translate(610,36)">
    <rect x="0" y="0" width="300" height="636" rx="46" fill="#1d1d1f"/>
    <rect x="13" y="13" width="274" height="610" rx="35" fill="#ffffff"/>
    <rect x="106" y="26" width="88" height="15" rx="7.5" fill="#1d1d1f"/>

    <text x="36" y="84" fill="#6e6e73" font-size="11" font-family="ui-sans-serif,system-ui">Good evening</text>
    <rect x="36" y="96" width="118" height="11" rx="5.5" fill="#1d1d1f"/>

    <!-- focus ring -->
    <rect x="36" y="128" width="228" height="152" rx="18" fill="#f5f5f7"/>
    <circle cx="150" cy="204" r="44" fill="none" stroke="#e3e3e7" stroke-width="9"/>
    <circle cx="150" cy="204" r="44" fill="none" stroke="#0071e3" stroke-width="9" stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="92" transform="rotate(-90 150 204)"/>
    <text x="150" y="210" fill="#1d1d1f" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-sans-serif,system-ui">25:00</text>

    <!-- tasks -->
    <rect x="36" y="296" width="228" height="34" rx="10" fill="#ffffff" stroke="#e3e3e7"/>
    <circle cx="55" cy="313" r="5.5" fill="#0071e3"/>
    <rect x="70" y="309" width="126" height="6" rx="3" fill="#d2d2d7"/>
    <rect x="36" y="338" width="228" height="34" rx="10" fill="#ffffff" stroke="#e3e3e7"/>
    <circle cx="55" cy="355" r="5.5" fill="none" stroke="#d2d2d7" stroke-width="1.6"/>
    <rect x="70" y="351" width="146" height="6" rx="3" fill="#e3e3e7"/>
    <rect x="36" y="380" width="228" height="34" rx="10" fill="#ffffff" stroke="#e3e3e7"/>
    <circle cx="55" cy="397" r="5.5" fill="none" stroke="#d2d2d7" stroke-width="1.6"/>
    <rect x="70" y="393" width="108" height="6" rx="3" fill="#e3e3e7"/>

    <!-- CTA -->
    <rect x="36" y="442" width="228" height="42" rx="21" fill="#1d1d1f"/>
    <rect x="104" y="459" width="88" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>

    <rect x="112" y="562" width="76" height="4.5" rx="2.25" fill="#d2d2d7"/>
  </g>

  <!-- right ticks -->
  <g font-family="ui-monospace,monospace" font-size="10" fill="#6e6e73" letter-spacing="1.5">
    <text x="985" y="180">OFFLINE</text>
    <text x="985" y="215">M3</text>
    <text x="985" y="250">SYNC</text>
  </g>
</svg>
